name: scoreboard-fok-local

services:
  timer-service:
    image: scoreboard-fok/timer-service:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: apps/timer-service/Dockerfile
    environment:
      TIMER_SERVICE_PORT: ${TIMER_SERVICE_PORT:-3010}
      GAME_CLOCK_DURATION_MS: ${GAME_CLOCK_DURATION_MS:-600000}
      SHOT_CLOCK_DURATION_MS: ${SHOT_CLOCK_DURATION_MS:-24000}
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${TIMER_SERVICE_PORT:-3010}:${TIMER_SERVICE_PORT:-3010}"
    restart: unless-stopped
    networks:
      - scoreboard-local

  server:
    image: scoreboard-fok/server:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-file:/data/scoreboard.db}
      TIMER_SERVICE_URL: http://timer-service:${TIMER_SERVICE_PORT:-3010}
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - scoreboard-local-data:/data
    depends_on:
      - timer-service
    restart: unless-stopped
    networks:
      - scoreboard-local

  client:
    image: scoreboard-fok/client:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVER_URL: http://server:3000
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${CLIENT_PORT:-3001}:3000"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - scoreboard-local

networks:
  scoreboard-local:
    driver: bridge

volumes:
  scoreboard-local-data:
