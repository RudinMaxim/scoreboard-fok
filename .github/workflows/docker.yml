name: Docker Build

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.*.yml"
      - "package.json"
      - "package-lock.json"
      - "nx.json"
      - "tsconfig*.json"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compose

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            dockerfile: apps/server/Dockerfile
            build_args: ""
          - service: client
            dockerfile: apps/client/Dockerfile
            build_args: ""
          - service: timer-service
            dockerfile: apps/timer-service/Dockerfile
            build_args: "--target runtime"
          - service: mcu-firmware
            dockerfile: apps/mcu-firmware/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" ${{ matrix.build_args }} -t "scoreboard-fok/${{ matrix.service }}:ci" .
